# Builds BoardSmyth AI installers and uploads them to Supabase Storage (bucket "releases").
# Run it from the GitHub "Actions" tab (Run workflow). The first job raises the version number in package.json
# by itself (patch by default, e.g. 0.2.1 -> 0.2.2) and commits it, then both installers are built from that commit.
# Pushing a tag like v0.3.0 also works and builds that exact version without bumping.
# One job builds Windows (signed with Azure Artifact Signing), one builds Mac (signed + notarized).
name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: What is new in this version (shown in the app's update message)
        required: false
        default: ''
      bump:
        description: How to raise the version number first
        type: choice
        options: [patch, minor, major, none]
        default: patch
      build_windows:
        description: Build Windows
        type: boolean
        default: true
      build_mac:
        description: Build Mac
        type: boolean
        default: true
  push:
    tags: ['v*']

jobs:
  version:
    if: ${{ github.event_name == 'push' || inputs.build_windows || inputs.build_mac }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Raise the version number
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$BUMP" != "none" ]; then
            npm version "$BUMP" --no-git-tag-version
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Release v$(node -p "require('./package.json').version")"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "Building version $(node -p "require('./package.json').version")" >> "$GITHUB_STEP_SUMMARY"

  windows:
    needs: version
    if: ${{ github.event_name == 'push' || inputs.build_windows }}
    runs-on: windows-latest
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Write app-config.json
        shell: bash
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_ANON: ${{ secrets.SUPABASE_ANON_KEY }}
          SB_CHECKOUT: ${{ secrets.CHECKOUT_URL }}
        run: |
          if [ -z "$SB_URL" ] || [ -z "$SB_ANON" ]; then echo "::error::GitHub secret SUPABASE_URL or SUPABASE_ANON_KEY is empty. The app would not start. Fix the secret and run again."; exit 1; fi
          if [ -z "$SB_CHECKOUT" ]; then echo "::warning::GitHub secret CHECKOUT_URL is empty. Subscribing from the app will not work."; fi
          cat > app-config.json <<JSON
          {"supabaseUrl":"${{ secrets.SUPABASE_URL }}","supabaseAnonKey":"${{ secrets.SUPABASE_ANON_KEY }}","checkoutUrl":"${{ secrets.CHECKOUT_URL }}"}
          JSON
      - run: npm ci
      - name: Build, sign and package
        run: npm run dist
      - name: Upload to Supabase
        env:
          NOTES: ${{ inputs.notes }}
        shell: bash
        run: node scripts/publish-release.mjs win "$NOTES"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/BoardSmyth-AI-Setup.exe
          retention-days: 7

  mac:
    needs: version
    if: ${{ github.event_name == 'push' || inputs.build_mac }}
    runs-on: macos-latest   # Apple Silicon
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Write app-config.json
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_ANON: ${{ secrets.SUPABASE_ANON_KEY }}
          SB_CHECKOUT: ${{ secrets.CHECKOUT_URL }}
        run: |
          if [ -z "$SB_URL" ] || [ -z "$SB_ANON" ]; then echo "::error::GitHub secret SUPABASE_URL or SUPABASE_ANON_KEY is empty. The app would not start. Fix the secret and run again."; exit 1; fi
          if [ -z "$SB_CHECKOUT" ]; then echo "::warning::GitHub secret CHECKOUT_URL is empty. Subscribing from the app will not work."; fi
          cat > app-config.json <<JSON
          {"supabaseUrl":"${{ secrets.SUPABASE_URL }}","supabaseAnonKey":"${{ secrets.SUPABASE_ANON_KEY }}","checkoutUrl":"${{ secrets.CHECKOUT_URL }}"}
          JSON
      - run: npm ci
      - name: Import signing certificate into a build keychain
        env:
          CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPW="$(uuidgen)"
          printf %s "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KC"
          rm -f "$RUNNER_TEMP/cert.p12"
          # The bundle holds two certificates with the same Developer ID name, which makes codesign
          # report "ambiguous". Keep the first one in this temporary keychain and drop the rest.
          KEEP=1
          for H in $(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | awk '{print $2}'); do
            if [ "$KEEP" = "1" ]; then KEEP=0; else security delete-certificate -Z "$H" "$KC"; fi
          done
          echo "Signing identities available:"
          security find-identity -v -p codesigning "$KC" | sed -E 's/[0-9A-F]{40}/<hash>/'
      - name: Check Apple notarization secrets
        run: |
          missing=""
          [ -z "$APPLE_ID" ] && missing="$missing APPLE_ID"
          [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] && missing="$missing APPLE_APP_SPECIFIC_PASSWORD"
          [ -z "$APPLE_TEAM_ID" ] && missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::These GitHub secrets are empty or missing:$missing. Without them the Mac app is not notarized and macOS refuses to open it. Add them and run again."
            exit 1
          fi
      - name: Build, sign and notarize
        run: npm run dist:mac
      - name: Verify the app is notarized (the build stops here if not)
        run: |
          APP="release/mac-arm64/BoardSmyth AI.app"
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"
      - name: Upload to Supabase
        env:
          NOTES: ${{ inputs.notes }}
        run: node scripts/publish-release.mjs mac "$NOTES"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: release/*.dmg
          retention-days: 7
